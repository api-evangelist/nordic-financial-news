aid: nordic-financial-news
name: Nordic Financial News
image: https://nordicfinancialnews.com/assets/nfn-og-c4be56ba.jpg
description: Nordic Financial News delivers structured, English-translated financial
  news from 70+ Nordic-language sources across Sweden, Norway, Denmark, Finland and
  Iceland, with synthesized stories, company and exchange reference data, and a financial
  calendar of earnings, dividends and AGMs, through a REST API, a remote OAuth MCP
  server and the nfn CLI.
