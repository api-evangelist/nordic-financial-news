        updated_at:
          type: string
          format: date-time
          description: When this record last changed (ISO 8601). This is the clock incremental sync runs on. Pass your last completed sync time as `updated_after`, drain every page via `pagination.next_cursor`, and only then advance your stored timestamp.
          example: '2026-10-23T09:20:00.000Z'
        company_ids:
          type: array
