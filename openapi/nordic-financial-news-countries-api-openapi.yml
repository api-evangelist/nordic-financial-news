openapi: 3.2.0
info:
  title: Nordic Financial News Countries API
  version: v1.0
  description: REST API for Nordic financial news.
  contact:
    name: API Support
    email: hello@nordicfinancialnews.com
servers:
- url: https://nordicfinancialnews.com
  description: Production server
tags:
- name: Countries
paths:
  /api/v1/countries:
    get:
      summary: List Countries
      tags:
      - Countries
      security:
      - bearer_auth: []
      description: Returns the Nordic countries covered by the API, ordered alphabetically. Use the country `id` or `iso2_code` to filter articles, stories, and companies by country.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of countries to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor from a previous response.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include. Available fields: `id`, `name`, `iso2_code`.'
        example: id,name,iso2_code
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified` if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304 Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Countries retrieved successfully
          content:
            application/json:
              examples:
                countries_list:
                  value:
                    countries:
                    - id: ctry_sweden12
                      name: Sweden
                      iso2_code: SE
                    pagination:
                      count: 1
                      next_cursor: null
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CountrySummary'
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                      next_cursor:
                        type:
                        - string
                        - 'null'
                required:
                - countries
        '304':
          description: Not Modified
      operationId: getApiV1Countries
      x-operation-id-source: derived
  /api/v1/countries/{identifier}:
    parameters:
    - name: identifier
      in: path
      required: true
      description: Country ID, ISO 3166-1 alpha-2 code (e.g. `SE`), or slug (e.g. `sweden`)
      schema:
        type: string
    get:
      summary: Get Country Details
      tags:
      - Countries
      security:
      - bearer_auth: []
      description: Returns details for a single country, including its stock exchanges. Look up by country ID or ISO 3166-1 alpha-2 code (e.g. `SE`).
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified` if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304 Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Country retrieved successfully
          content:
            application/json:
              examples:
                country_detail:
                  value:
                    country:
                      id: ctry_sweden12
                      name: Sweden
                      iso2_code: SE
                      exchanges:
                      - id: exch_xsto1234
                        name: Nasdaq Stockholm
                        mic_code: XSTO
                        acronym: STO
              schema:
                type: object
                properties:
                  country:
                    $ref: '#/components/schemas/CountrySummary'
                required:
                - country
        '304':
          description: Not Modified
        '404':
          description: Country not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: The requested resource could not be found
                    instance: urn:request:abc123
              schema:
                $ref: '#/components/schemas/problem_details'
      operationId: getApiV1CountriesByIdentifier
      x-operation-id-source: derived
components:
  schemas:
    problem_details:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          description: URI that identifies the problem type
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          description: URI that identifies the specific occurrence
    CountrySummary:
      type: object
      required:
      - id
      - name
      - iso2_code
      properties:
        id:
          type: string
          description: Unique country identifier
          example: ctry_sweden12
        name:
          type: string
          description: Country display name
          example: Sweden
        iso2_code:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: SE
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API Key authentication using Bearer token
x-provenance:
  method: harvested
  publisher: Nordic Financial News
  source: https://nordicfinancialnews.com/openapi/v1/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
