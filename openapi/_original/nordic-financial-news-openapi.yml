          type: string
      responses:
        '200':
          description: Watchlists retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  watchlists:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WatchlistSummary"
                required:
                - watchlists
        '304':
          description: Not Modified
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/watchlists/{id}":
    get:
      summary: Get Watchlist Details
      tags:
      - Watchlists
      security:
      - bearer_auth: []
      description: Returns watchlist details along with a paginated list of its companies,
        ordered alphabetically by company name. Hidden and unverified companies are
        excluded. Requires the `read:watchlist` scope.
      parameters:
      - name: id
        in: path
        required: true
        description: Watchlist ID (e.g. `a1b2c3d4e5f6`).
        example: a1b2c3d4e5f6
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Number of companies to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor returned as `pagination.next_cursor`
          from a previous response.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Watchlist retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  watchlist:
                    "$ref": "#/components/schemas/WatchlistSummary"
                  companies:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CompanySummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                      next_cursor:
                        type: string
                        nullable: true
                required:
                - watchlist
                - companies
        '304':
          description: Not Modified
        '404':
          description: Watchlist not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: The requested resource could not be found
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
servers:
- url: https://nordicfinancialnews.com
  description: Production server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API Key authentication using Bearer token
  schemas:
    problem_details:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          description: URI that identifies the problem type
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          description: URI that identifies the specific occurrence
    ArticleSummary:
      type: object
      required:
      - id
      - title
      - published_at
      - updated_at
      - article_url
      - content_type
      - category
      - source
      - company_ids
      - country
      properties:
        id:
          type: string
          description: Unique article identifier
          example: art_abc123def
        title:
          type: string
          description: Article title in English. Machine-translated when the source
            article is not in English.
          example: Volvo Reports Record Q3 Earnings
        article_url:
          type: string
          description: Link to the original article
          example: https://di.se/articles/volvo-q3-2026
        content_type:
          type: string
          description: Type of article content
          example: news
          enum:
          - news
          - analysis
          - press_release
          - market_commentary
          - market_news
          - trading_halt
          - trading_event
          - other
        published_at:
          type: string
          format: date-time
          description: When the article was published by its source (ISO 8601). This
            is editorial time, not the time the article reached this API. Use it to
            filter by when news happened, never to track what is new to you.
          example: '2026-03-15T09:30:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 'When this record last changed (ISO 8601). This is the clock
            incremental sync runs on. It only ever moves forward, unlike published_at.
            To sync: pass your last completed sync time as `updated_after`, drain
            every page via `pagination.next_cursor`, and only then advance your stored
            timestamp.'
          example: '2026-03-15T09:35:00.000Z'
        category:
          type: object
          description: Article category
          properties:
            id:
              type: string
              example: cat_earnings1
            name:
              type: string
              example: Earnings & Financial Results
        source:
          type: object
          description: The news source that published this article
          properties:
            id:
              type: string
              description: Unique source identifier
              example: abc123def456
            name:
              type: string
              example: Dagens Industri
            domain:
              type: string
              example: di.se
            source_type:
              type: string
              example: news_publication
              enum:
              - news_publication
              - wire_service
              - press_release
              - government
              - trade_publication
              - blog
              - stock_exchange
              - research
        company_ids:
          type: array
          items:
            type: string
          description: IDs of companies mentioned in the article
          example:
          - uejazctgchj4
        country:
          type: string
          nullable: true
          description: Country code (ISO 3166-1 alpha-2)
          example: SE
        event_id:
          type: string
          nullable: true
          description: ID of the event this article belongs to. Null when the article
            has not been assigned to an event yet. An event that has since been merged
            or removed still answers `GET /events/{id}` with a tombstone rather than
            a 404.
          example: 8fzq2rmtnk5c
    ArticleDetail:
      allOf:
      - "$ref": "#/components/schemas/ArticleSummary"
      - type: object
        properties:
          source_title:
            type: string
            description: Original article title in source language
            example: Volvo rapporterar rekordresultat för Q3
          summary:
            type: string
            description: 'AI-generated English summary of the article: a machine translation
              and paraphrase of the source text, not verbatim.'
            example: Volvo reported record Q3 earnings driven by strong truck demand...
          updated_at:
            type: string
            format: date-time
            description: When the article was last updated (ISO 8601)
            example: '2026-03-15T10:00:00.000Z'
          story_ids:
            type: array
            items:
              type: string
            description: IDs of published stories covering this article, if any
            example:
            - story_volvo_q3
          companies:
            type: array
            description: Companies mentioned in this article, primary company first
            items:
              type: object
              required:
              - id
              - name
              - is_primary
              - association_tier
              properties:
                id:
                  type: string
                  description: Unique company identifier
                  example: uejazctgchj4
                name:
                  type: string
                  description: Company name
                  example: AB Volvo (Volvo Group)
                ticker:
                  type: string
                  nullable: true
                  description: Primary stock ticker
                  example: VOLV-B
                is_primary:
                  type: boolean
                  description: Whether this company is the primary subject of the
                    article
                  example: true
                association_tier:
                  type: string
                  enum:
                  - principal
                  - peripheral
                  description: How the company relates to the article. `principal`
                    (subject, partner, investor, competitor) is the default set; `peripheral`
                    (source, advisor, passing mention) appears only when `include_peripheral=true`.
                    Always present.
                  example: principal
            example:
            - id: uejazctgchj4
              name: AB Volvo (Volvo Group)
              ticker: VOLV-B
              is_primary: true
              association_tier: principal
          key_points:
            type: array
            items:
              type: string
            description: Key points from the article. Machine-generated English paraphrases
              of statements in the source article, not verbatim quotations.
            example:
            - Revenue up 15% year-over-year
            - Strong truck demand in Europe
    StorySummary:
      type: object
      required:
      - id
      - title
      - summary
      - article_count
      - published_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique story identifier
          example: story_volvo_q3
        title:
          type: string
          description: Story title
          example: Volvo Reports Record Q3 Results
        summary:
          type: string
          description: Story summary
          example: Volvo reported record third-quarter earnings, beating analyst expectations...
        article_count:
          type: integer
          description: Number of articles in this story (matches the length of article_ids)
          example: 4
        published_at:
          type: string
          format: date-time
          description: 'When the story''s newest source article was published (ISO
            8601). This is editorial time, not the time the story reached this API:
            a story about older news carries an older date. Use it to filter by when
            news happened, never to track what is new to you.'
          example: '2026-03-15T09:30:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: 'When this record last changed (ISO 8601). This is the clock
            incremental sync runs on. It only ever moves forward, unlike published_at.
            To sync: pass your last completed sync time as `updated_after`, drain
            every page via `pagination.next_cursor`, and only then advance your stored
            timestamp.'
          example: '2026-03-15T09:35:00.000Z'
        article_ids:
          type: array
          items:
            type: string
          description: IDs of articles in this story, most relevant first
          example:
          - art_abc123def
          - art_def456ghi
        country:
          type: string
          nullable: true
          description: Country code (ISO 3166-1 alpha-2)
          example: SE
        company_ids:
          type: array
          items:
            type: string
          description: IDs of companies mentioned in this story
          example:
          - uejazctgchj4
        category:
          type: object
          description: Story category
          properties:
            id:
              type: string
            name:
              type: string
        event_id:
          type: string
          nullable: true
          description: ID of the event this story was generated from. An event that
            has since been merged or removed still answers `GET /events/{id}` with
            a tombstone rather than a 404.
          example: 8fzq2rmtnk5c
    StoryDetail:
      allOf:
      - "$ref": "#/components/schemas/StorySummary"
      - type: object
        properties:
          content:
            type: string
            format: markdown
            description: Full story content in Markdown format
            example: "## Volvo Q3 Results\\n\\nVolvo reported record earnings..."
          updated_at:
            type: string
            format: date-time
            description: When the story was last updated (ISO 8601)
            example: '2026-03-15T14:00:00.000Z'
          companies:
            type: array
            description: Companies mentioned in this story
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Unique company identifier
                  example: uejazctgchj4
                name:
                  type: string
                  description: Company name
                  example: AB Volvo (Volvo Group)
                ticker:
                  type: string
                  nullable: true
                  description: Primary stock ticker
                  example: VOLV-B
            example:
            - id: uejazctgchj4
              name: AB Volvo (Volvo Group)
              ticker: VOLV-B
    CategorySummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Unique category identifier
          example: cat_business12
        name:
          type: string
          description: Category display name
          example: Earnings & Financial Results
    EventTypeSummary:
      type: object
      required:
      - id
      - slug
      - label
      - category
      - summary
      properties:
        id:
          type: string
          description: Unique event type identifier
          example: evt_earnrep01
        slug:
          type: string
          description: 'Event type slug: the value for the `event_type` filter on
            `GET /api/v1/events` only. `GET /api/v1/calendar_events` takes a different,
            underscored vocabulary enumerated on that endpoint; these slugs are not
            accepted there, and a few spellings overlap while denoting different things.'
          example: earnings-report
        label:
          type: string
          description: Event type display label
          example: Earnings Report
        category:
          type: string
          description: The broader category this type belongs to
          enum:
          - earnings
          - ma
          - executive_changes
          - regulatory
          - dividends
          - equity_actions
          - legal
          - credit
          - bankruptcy
          - partnerships
          - products
          - restructuring
          - macro
          - funding
          - esg
          - operations
          - analyst_ratings
          - shareholder_activity
          - other
          - commentary
          example: earnings
        summary:
          type: string
          nullable: true
          description: One-line description of what this type covers
          example: A company's scheduled quarterly, interim or annual results without
            consensus framing.
    SourceSummary:
      type: object
      required:
      - id
      - name
      - domain
      - source_type
      properties:
        id:
          type: string
          description: Unique source identifier
          example: abc123def456
        name:
          type: string
          description: Source display name
          example: Dagens Industri
        domain:
          type: string
          description: Primary domain of the source
          example: di.se
        country:
          type: string
          nullable: true
          description: Country code (ISO 3166-1 alpha-2)
          example: SE
        source_type:
          type: string
          description: Source type
          example: news_publication
          enum:
          - news_publication
          - wire_service
          - press_release
          - government
          - trade_publication
          - blog
          - stock_exchange
          - research
    CompanySummary:
      type: object
      required:
      - id
      - name
      - slug
      - former_tickers
      - also_listed_on
      properties:
        id:
          type: string
          description: Unique company identifier
          example: w55fcw3pbg3p
        name:
          type: string
          description: Company name
          example: Volvo Car AB
        slug:
          type: string
          description: URL-friendly company name
          example: VOLCAR-B
        ticker:
          type: string
          nullable: true
          description: Primary stock ticker (null if unlisted)
          example: VOLCAR-B
        former_tickers:
          type: array
          items:
            type: string
          description: Tickers the company was formerly listed under, from delisted
            or renamed listings, excluding any that are still a current ticker. Always
            present; empty when none. The ticker filter resolves former tickers as
            well as the current one, so a match on an old ticker still returns the
            company; this field tells you the ticker you searched by is historical.
          example:
          - VOLV
        is_active:
          type: boolean
          description: Whether the company is currently active/operating
          example: true
        exchange:
          type: object
          nullable: true
          description: Primary exchange where the company is listed
          properties:
            id:
              type: string
              description: Exchange identifier
            name:
              type: string
              description: Exchange display name
            mic_code:
              type: string
              description: ISO 10383 Market Identifier Code
        also_listed_on:
          type: array
          description: 'The company''s other active listings, excluding the primary
            listing above: cross-listings on other exchanges and additional share
            classes (which may be on the same exchange). Always present; empty when
            the company is single-listed or unlisted. The row''s ticker/exchange fields
            are the primary listing only. Company detail stock_listings is the authoritative
            full set.'
          items:
            type: object
            required:
            - ticker
            - mic_code
            properties:
              ticker:
                type: string
                description: Ticker on this secondary exchange
                example: VOLCAR-B
              mic_code:
                type: string
                description: ISO 10383 Market Identifier Code of this exchange
                example: XSTO
          example: []
    CompanyDetail:
      allOf:
      - "$ref": "#/components/schemas/CompanySummary"
      - type: object
        properties:
          description:
            type: string
            nullable: true
            description: Company description
            example: Volvo Car AB (publ.) designs, develops, manufactures, markets,
              assembles, and sells passenger cars in Sweden and internationally.
          sector:
            type: string
            nullable: true
            description: Industry sector
            example: Consumer Discretionary
          website:
            type: string
            nullable: true
            description: Company website
            example: https://www.volvocars.com/se
          article_count:
            type: integer
            description: Number of articles mentioning this company
            example: 176
          story_count:
            type: integer
            description: Number of stories mentioning this company
            example: 11
          parent_company:
            type: object
            nullable: true
            description: Parent company, if this is a subsidiary
            properties:
              id:
                type: string
              name:
                type: string
              ticker:
                type: string
                nullable: true
          subsidiaries:
            type: array
            description: Subsidiary companies
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                ticker:
                  type: string
                  nullable: true
          indices:
            type: array
            description: Stock index memberships (e.g. OMXS30)
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                symbol:
                  type: string
          stock_listings:
            type: array
            description: All stock listings across exchanges
            items:
              type: object
              properties:
                ticker:
                  type: string
                  description: Full ticker including exchange suffix
                primary:
                  type: boolean
                  description: Whether this is the primary listing
                exchange:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    mic_code:
                      type: string
          country:
            type: object
            nullable: true
            description: Country where the company is domiciled
            properties:
              id:
                type: string
                description: Country identifier
              name:
                type: string
                description: Country name
                example: Sweden
              iso2_code:
                type: string
                description: ISO 3166-1 alpha-2 code
                example: SE
          registry:
            type: object
            nullable: true
            description: Official company registry data from Nordic registries (e.g.
              Bolagsverket, PRH). Null if no registry data exists.
            properties:
              source:
                type: string
                nullable: true
                description: Name of the official registry
                example: Bolagsverket
              registered_name:
                type: string
                nullable: true
                description: Official registered company name
                example: Volvo Personvagnar Aktiebolag
              company_form:
                type: string
                nullable: true
                description: Legal form of the company
                example: Aktiebolag
              city:
                type: string
                nullable: true
                description: Registered city
                example: GÖTEBORG
              founded:
                type: string
                nullable: true
                description: Founding or registration date
                example: '1960-10-28'
              employees:
                type: integer
                nullable: true
                description: Number of employees
                example: 43000
              industry:
                type: string
                nullable: true
                description: Industry classification from registry
                example: Tillverkning av personbilar och andra lätta motorfordon
              bankruptcy:
                type: boolean
                nullable: true
                description: Whether the company is in bankruptcy proceedings
              under_liquidation:
                type: boolean
                nullable: true
                description: Whether the company is under liquidation
              share_capital:
                type: object
                nullable: true
                description: Registered share capital
                properties:
                  amount:
                    type: number
                    nullable: true
                    description: Share capital amount
                    example: 50000000
                  currency:
                    type: string
                    nullable: true
                    description: Currency code (ISO 4217)
                    example: SEK
              institutional_sector:
                type: string
                nullable: true
                description: Institutional sector classification
                example: Non-financial corporations
              deregistered_at:
                type: string
                nullable: true
                description: Date the company was deregistered, if applicable
                example: '2023-01-15'
              deregistration_reason:
                type: string
                nullable: true
                description: Reason for deregistration
                example: Merger
          updated_at:
            type: string
            format: date-time
            description: When the company was last updated (ISO 8601)
    CountrySummary:
      type: object
      required:
      - id
      - name
      - iso2_code
      properties:
        id:
          type: string
          description: Unique country identifier
          example: ctry_sweden12
        name:
          type: string
          description: Country display name
          example: Sweden
        iso2_code:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: SE
    ExchangeSummary:
      type: object
      required:
      - id
      - name
      - mic_code
      properties:
        id:
          type: string
          description: Unique exchange identifier
          example: exch_nasdaq1
        name:
          type: string
          description: Exchange display name
          example: Nasdaq Stockholm
        mic_code:
          type: string
          description: ISO 10383 Market Identifier Code
          example: XSTO
        acronym:
          type: string
          nullable: true
          description: Exchange acronym
          example: NASDAQ
        country:
          type: object
          description: Country where the exchange is located
          properties:
            id:
              type: string
            name:
              type: string
            iso2_code:
              type: string
    ExchangeDetail:
      allOf:
      - "$ref": "#/components/schemas/ExchangeSummary"
      - type: object
        properties:
          operating_mic_code:
            type: string
            nullable: true
            description: Parent operating MIC code (for segment exchanges)
            example: XSTO
          currency:
            type: string
            nullable: true
            description: Primary trading currency (ISO 4217)
            example: SEK
          ticker_suffix:
            type: string
            nullable: true
            description: Ticker suffix used for this exchange
            example: ST
          timezone:
            type: string
            nullable: true
            description: Exchange timezone
            example: Europe/Stockholm
          city:
            type: string
            nullable: true
            description: City where the exchange is located
          indices:
            type: array
            description: Stock indices on this exchange
            items:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                symbol:
                  type: string
    IndexSummary:
      type: object
      required:
      - id
      - name
      - symbol
      properties:
        id:
          type: string
          description: Unique stock index identifier
          example: idx_omxs30abc
        name:
          type: string
          description: Index display name
          example: OMX Stockholm 30
        symbol:
          type: string
          description: Index symbol
          example: OMXS30
        pan_nordic:
          type: boolean
          description: True if the index spans multiple Nordic exchanges (e.g. OMXN40),
            false if tied to a single exchange (e.g. OMXS30)
          example: false
        exchange:
          type: object
          nullable: true
          description: Exchange associated with this index
          properties:
            id:
              type: string
            name:
              type: string
            mic_code:
              type: string
    IndexDetail:
      allOf:
      - "$ref": "#/components/schemas/IndexSummary"
      - type: object
        properties:
          description:
            type: string
            nullable: true
            description: Index description
            example: The 30 most-traded stocks on Nasdaq Stockholm
          companies_count:
            type: integer
            description: Number of distinct companies in this index (may be less than
              constituents when a company has multiple share classes)
            example: 30
    CalendarEventSummary:
      type: object
      required:
      - id
      - title
      - event_type
      - status
      - scheduled_at
      - company_id
      properties:
        id:
          type: string
          description: Unique calendar event identifier
          example: cale_q3volvo1
        title:
          type: string
          description: Event title as reported by the issuer or exchange
          example: Q3 2026 Interim Report
        description:
          type: string
          nullable: true
          description: Optional long-form description
          example: Publication of the interim report for Q3 2026 and earnings call
            at 10:00 CET.
        event_type:
          type: string
          description: The kind of calendar event
          enum:
          - earnings_report
          - earnings_call
          - agm
          - egm
          - dividend
          - capital_markets_day
          - trading_update
          - conference_presentation
          - ma_announcement
          - ma_offer_deadline
          - ma_completion
          - listing
          - delisting
          example: earnings_report
        status:
          type: string
          description: Event lifecycle status. `scheduled` is upcoming; `published`
            means the event has occurred (events flip ~2 days after their date); `cancelled`
            means the issuer withdrew it. List endpoints return `scheduled` + `published`
            and exclude `cancelled` by default. Pass the `status` query parameter
            to filter (e.g. `status=cancelled`).
          enum:
          - scheduled
          - published
          - cancelled
          example: scheduled
        date_precision:
          type: string
          description: Granularity of `scheduled_at`. `exact` = timestamp known; `day`
            = date only; `month` = only the month is known. Consumers that need a
            date should still use `scheduled_at` (set to a representative point inside
            the window).
          enum:
          - exact
          - day
          - month
          example: day
        fiscal_period:
          type: string
          nullable: true
          description: Fiscal period slug (required for report-type events, e.g. `q3_2026`,
            `fy_2025`). For a split fiscal year the year is the one in which the fiscal
            year ends (2025/26 → `fy_2026`).
          example: q3_2026
        scheduled_at:
          type: string
          format: date-time
          description: 'Scheduled date/time in UTC (ISO 8601). For the local calendar
            date use `local_time` instead: a day-precision event is stored at local
            midnight, so its UTC instant falls on the previous day for ahead-of-UTC
            (Nordic) zones.'
          example: '2026-10-22T05:00:00.000Z'
        timezone:
          type: string
          description: The issuer's IANA timezone, used to interpret `scheduled_at`.
            Resolved from the source article, falling back to the company's country
            zone.
          example: Europe/Stockholm
        local_time:
          type: string
          format: date-time
          description: "`scheduled_at` rendered in the issuer's `timezone` (ISO 8601
            with offset). Use this for the correct local date/time. Its date is right
            even for day-precision events."
          example: '2026-10-22T07:00:00.000+02:00'
        scheduled_at_changed_at:
          type: string
          format: date-time
          nullable: true
          description: When `scheduled_at` last changed. Useful for change-feed consumers
            tracking date moves.
          example: '2026-03-15T10:00:00.000Z'
        source_article_id:
          type: string
          nullable: true
          description: 'ID of the article the event was extracted from. `null` when
            the article is not retrievable (not live, or removed), or when the event
            was first found on a company website. If a company website later supplied
            the date, this still names the original article, and `source` names the
            website. Best-effort: on the free plan it may reference an article your
            plan can''t fetch (premium source or outside the age window).'
          example: art_xyz45678
        source:
          type: object
          nullable: true
          description: Who published the current date. `article` is a news article
            or company announcement. `company_website` is the issuer's own investor
            relations calendar. `null` when our editors set the date.
          properties:
            type:
              type: string
              enum:
              - article
              - company_website
              example: article
            name:
              type: string
              nullable: true
              description: 'The publisher: the outlet that carried the article, or
                the issuer''s investor relations site. `null` when the article is
                no longer available.'
              example: Cision
            url:
              type: string
              nullable: true
              description: The investor relations calendar page, for `company_website`.
                `null` for `article`.
              example:
            article_id:
              type: string
              nullable: true
              description: ID of the article, for `article`. Matches `source_article_id`.
                `null` when the article is no longer available, and for `company_website`.
              example: art_xyz45678
        company_id:
          type: string
          description: ID of the company this event relates to
          example: w55fcw3pbg3p
        company:
          type: object
          nullable: true
          description: The issuer this event belongs to, inlined so a calendar can
            be rendered without a lookup per row. `id` is the same value as `company_id`.
            `null` only when the issuer is not published by this API.
          properties:
            id:
              type: string
              description: Unique company identifier
              example: w55fcw3pbg3p
            name:
              type: string
              description: Company name
              example: Telefonaktiebolaget LM Ericsson
            ticker:
              type: string
              nullable: true
              description: Primary stock ticker. `null` for an unlisted issuer.
              example: ERIC-B
        country:
          type: string
          nullable: true
          description: Country ISO 3166-1 alpha-2 code
          example: SE
        dividend:
          type: object
          nullable: true
          description: Dividend lifecycle dates. `null` for non-dividend events. `scheduled_at`
            follows the priority ex-date > record-date > payment-date, whichever is
            explicitly stated.
          properties:
            ex_date:
              type: string
              nullable: true
              description: 'Ex-dividend date (YYYY-MM-DD). The market-event anchor:
                share price drops on this day.'
              example: '2026-04-25'
            record_date:
              type: string
              nullable: true
              description: Record date (YYYY-MM-DD). Holders of record on this date
                receive the dividend.
              example: '2026-04-28'
            payment_date:
              type: string
              nullable: true
              description: Payment date (YYYY-MM-DD). When the cash is distributed
                to shareholders.
              example: '2026-05-06'
            declaration_date:
              type: string
              nullable: true
              description: Declaration / announcement date (YYYY-MM-DD). Metadata
                only, never used as the calendar anchor.
              example: '2026-03-20'
            kind:
              type: string
              enum:
              - ordinary
              - special
              description: Tranche type. `ordinary` for the recurring/regular dividend;
                `special` for an extra/bonus/one-off dividend. When an issuer proposes
                both for the same date, they are returned as two separate events.
              example: ordinary
        updated_at:
          type: string
          format: date-time
          description: When the event was last updated (ISO 8601). Use with `updated_after`
            for polling
          example: '2026-03-01T09:00:00.000Z'
    CalendarEventDetail:
      allOf:
      - "$ref": "#/components/schemas/CalendarEventSummary"
    EventSummary:
      type: object
      required:
      - id
      - status
      - updated_at
      description: 'An event: one real-world development, grouping the articles that
        report it. A `merged` or `removed` event (see `status`) returns only the minimal
        tombstone fields (`id`, `status`, `merged_into`, `updated_at`). Title, significance,
        event_type, counts, and every id array are omitted, never null-but-present,
        so a tombstone carries no content.'
      properties:
        id:
          type: string
          description: Unique event identifier
          example: k3n8vdczq1mp
        title:
          type: string
          description: Event title (omitted on a tombstone)
          example: Volvo AB announces Q3 2026 results
        status:
          type: string
          description: Lifecycle status. `active`/`closed` are live (closed = coverage
            window lapsed but the event stays visible and can reopen). `merged` =
            absorbed into another event (see `merged_into`); `removed` = withdrawn
            from the feed (no live articles remain, or it was found to be incorrect).
            `merged`/`removed` never appear in the default list and carry only the
            tombstone fields.
          enum:
          - active
          - closed
          - merged
          - removed
          example: active
        significance:
          type: string
          description: Editorial importance (omitted on a tombstone). `notable` =
            front-page-worthy; `routine` = factual ledger record; `commentary` = single-article
            opinion/analysis.
          enum:
          - notable
          - routine
          - commentary
          example: notable
        event_type:
          type: object
          nullable: true
          description: The kind of event (omitted on a tombstone)
          properties:
            slug:
              type: string
              example: earnings-report
            label:
              type: string
              example: Earnings Report
            category:
              type: string
              example: earnings
        article_count:
          type: integer
          description: Number of live articles reporting this event (omitted on a
            tombstone). This is the total count. Your plan's age and source restrictions
            do not reduce it; use GET on the event to see which of them your plan
            can fetch.
          example: 3
        first_reported_at:
          type: string
          format: date-time
          nullable: true
          description: 'When this event was first reported (ISO 8601, omitted on a
            tombstone): the earliest known publication time among this event''s member
            articles. Falls back to `last_article_at` for ordering when null. This
            is editorial time, not the time the record reached this API.'
          example: '2026-10-22T05:00:00.000Z'
        last_article_at:
          type: string
          format: date-time
          nullable: true
          description: Publication time of the newest article reporting this event
            (ISO 8601, omitted on a tombstone).
          example: '2026-10-23T09:15:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: When this record last changed (ISO 8601). This is the clock
            incremental sync runs on. Pass your last completed sync time as `updated_after`,
            drain every page via `pagination.next_cursor`, and only then advance your
            stored timestamp.
          example: '2026-10-23T09:20:00.000Z'
        company_ids:
          type: array
          items:
            type: string
          description: IDs of companies associated with this event, verified and visible
            only (omitted on a tombstone). Restricted to companies with an active-involvement
            role (subject, acquirer, target, investor, issuer, partner) unless `include_peripheral=true`.
          example:
          - uejazctgchj4
        story_ids:
          type: array
          items:
            type: string
          description: IDs of published stories generated from this event, if any
            (omitted on a tombstone)
          example:
          - 8fzq2rmtnk5c
        merged_into:
          type: string
          nullable: true
          description: ID of the surviving event this one was merged into. Present
            only when `status` is `merged`; null for every other status, including
            `removed` and on some older merged events.
          example: v3xdq8fmz1kn
        related_to:
          type: string
          nullable: true
          description: 'Commentary-only metadata: the `id` of the factual event this
            commentary event comments on or reacts to, when the piece is about a specific
            factual event. Always null for non-commentary events, and often null for
            commentary events too (the piece may not be about a specific event). Filter
            with `related_to=<id>` to find commentary reacting to a given event.'
          example: v3xdq8fmz1kn
    EventDetail:
      allOf:
      - "$ref": "#/components/schemas/EventSummary"
      - type: object
        properties:
          summary:
            type: string
            nullable: true
            description: Event summary (omitted on a tombstone). Null when no summary
              has been generated for the event yet.
            example: Volvo AB reported Q3 2026 results, beating analyst expectations
              on strong truck demand...
          article_ids:
            type: array
            items:
              type: string
            description: IDs of this event's live articles that your plan can fetch,
              oldest first by publication time (omitted on a tombstone). May be shorter
              than `article_count` on a plan with age or source restrictions. That
              gap is not an error.
            example:
            - h4mzq918kxwc
            - q2fnk75dxzmv
          primary_disclosure_article_id:
            type: string
            nullable: true
            description: 'The primary disclosure among this event''s live articles
              your plan can fetch: the earliest one from a primary-disclosure source
              (wire service, stock exchange feed, PR platform, or government body).
              Null when the event has none. Always an element of `article_ids`, or
              null; omitted on a tombstone. A plan with age or source restrictions
              may see a later official copy of the same disclosure, or null, instead
              of the true earliest one.'
            example: h4mzq918kxwc
          member_figures_disagree:
            type: boolean
            description: True when this event's own member articles report divergent
              values for the same headline figure (e.g. one source reports operating
              profit as −2.2m, another as −2.4m). A signal that the single consolidated
              summary hides a source-level disagreement. Omitted on a tombstone.
            example: false
          figure_divergence:
            type: object
            nullable: true
            description: 'Detail behind `member_figures_disagree`: the specific metrics
              whose values disagree across member articles, with the per-source figures
              and range. Null when there is no disagreement; omitted on a tombstone.'
            properties:
              groups:
                type: array
                description: One entry per disagreeing metric.
                items:
                  type: object
                  properties:
                    concept:
                      type: string
                      description: The canonical measure that disagrees
                      example: operating_profit
                    basis:
                      type: string
                      description: Whether the measure is as-reported or an adjusted/alternative
                        one
                      example: reported
                    role:
                      type: string
                      description: Whether the figure is an outcome, forecast, or
                        comparative
                      example: actual
                    period:
                      type: string
                      description: The reporting period the figure covers
                      example: 2026-Q1
                    currency:
                      type: string
                      description: ISO currency of the figures
                      example: SEK
                    labels:
                      type: array
                      items:
                        type: string
                      description: The source's own wording(s) for the measure
                      example:
                      - Rörelseresultatet
                    min:
                      type: number
                      description: Smallest reported value (absolute base units)
                      example: 313000000.0
                    max:
                      type: number
                      description: Largest reported value (absolute base units)
                      example: 395000000.0
                    values:
                      type: array
                      description: The reported figure per member article.
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The reporting article's id
                            example: h4mzq918kxwc
                          source:
                            type: string
                            nullable: true
                            description: The reporting source's name
                            example: MFN
                          normalized_value:
                            type: number
                            description: The figure in absolute base units
                            example: 395000000.0
                          value:
                            type: string
                            description: The figure as originally stated
                            example: 395 MSEK
          companies:
            type: array
            description: 'The same companies as `company_ids`, with detail per company:
              name, ticker, primary flag, association tier. Primary company first;
              omitted on a tombstone.'
            items:
              type: object
              required:
              - id
              - name
              - is_primary
              - association_tier
              properties:
                id:
                  type: string
                  description: Unique company identifier
                  example: uejazctgchj4
                name:
                  type: string
                  description: Company name
                  example: AB Volvo (Volvo Group)
                ticker:
                  type: string
                  nullable: true
                  description: Primary stock ticker
                  example: VOLV-B
                is_primary:
                  type: boolean
                  description: Whether this company is the primary subject of the
                    event
                  example: true
                association_tier:
                  type: string
                  enum:
                  - principal
                  - peripheral
                  description: How the company relates to the event. `principal` (subject,
                    acquirer, target, investor, issuer, partner) is the default set;
                    `peripheral` (advisor, speaker, passing mention) appears only
                    when `include_peripheral=true`. Always present.
                  example: principal
    WatchlistSummary:
