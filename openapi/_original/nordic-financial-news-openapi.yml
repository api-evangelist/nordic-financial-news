openapi: 3.0.1
info:
  title: Nordic Financial News API
  version: v1.0
  description: |
    REST API for Nordic financial news. Each article is summarized in English (headline, short summary, and key points) with the original-language article linked via `article_url`. The full article body stays at the source.

    ## Authentication
    All endpoints require Bearer token authentication using an API key.
    Include the API key in the Authorization header:
    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## Rate Limiting
    Rate limits apply per account, shared across every API key on that account — not per
    individual key:
    - **Free**: 100 requests/hour
    - **Plus**: 100 requests/hour
    - **Pro**: 5,000 requests/hour

    On Free and Plus, MCP tool calls have their own hourly and monthly allowance and do not
    count toward these REST limits. On Pro, REST requests and MCP tool calls share one allowance.

    Rate limit information is included in response headers:
    - `X-RateLimit-Limit`: Maximum requests per hour
    - `X-RateLimit-Remaining`: Requests remaining
    - `X-RateLimit-Reset`: Seconds until limit resets
    - `X-RateLimit-Policy`: Human-readable rate limit policy (e.g. `5000 per hour; fixed window`)

    A single client IP is additionally capped at 300 requests per 5-minute window, so
    reaching your account's full hourly allowance requires spreading requests across more
    than one source IP.

    The `/health` endpoint is exempt from rate limiting and does not return rate limit headers.

    ## Monthly Usage Limits
    Free and Plus accounts have a fixed monthly allowance that resets at the start of each
    calendar month, shared across every API key on the account:
    - **Free**: 100 requests/month
    - **Plus**: 100 requests/month

    Responses on these plans include:
    - `X-Monthly-Limit`: Maximum requests for the current month
    - `X-Monthly-Remaining`: Requests remaining this month
    - `X-Monthly-Reset`: ISO 8601 timestamp when the allowance resets

    When the allowance is exceeded, the API returns `429 Too Many Requests` with a `Retry-After` header.

    Pro has no hard limit. It includes 25,000 requests per billing cycle, with usage-based
    pricing beyond that, so requests are never blocked. Responses on Pro include:
    - `X-Monthly-Usage`: Requests used in the current billing cycle
    - `X-Monthly-Reset`: ISO 8601 timestamp when the current billing cycle ends

    A Pro billing cycle follows your subscription's billing period, which begins on the
    date you subscribed and is not necessarily a calendar month. Usage is counted by day,
    so the first day of a billing cycle is counted in full.

    ## Caching
    Every list and single-resource endpoint returns an `ETag`. Most also return
    `Last-Modified` (on lists, when the page is not empty); `GET /stories/{id}` and the
    Events endpoints do not. Send the ETag back as `If-None-Match`, or the date as
    `If-Modified-Since`, to receive `304 Not Modified` when nothing has changed. A 304
    has no body and does not count against the monthly request allowance.

    `GET /events`, `GET /events/{id}` and `GET /companies/{identifier}/events` return an
    `ETag` but no `Last-Modified`, so revalidate those routes with `If-None-Match`. An
    event's visible company and story membership, and its live article count, all change
    without moving its `updated_at`, so a date-based validator would report "not
    modified" across a change the `ETag` catches.

    Some requests are never cached and return `Cache-Control: no-cache, no-store` with
    no `ETag`: full-text search (`q`), `updated_after` sync requests, and `GET /search`.

    The `ETag` reflects the response as served, not only record timestamps. On articles
    and stories, including the company-scoped routes, and on `GET /calendar_events`, it
    changes when a plan limit alters the visible set, and on stories when a story's
    visible article set changes. A changed `ETag` does not necessarily mean a record was
    updated. On the Events endpoints the `ETag` additionally covers each event's visible
    company and story ids and its live article count, none of which move the event's
    `updated_at`.

    ## Pagination
    List endpoints support cursor-based pagination. Use the `cursor` parameter
    with the value from `pagination.next_cursor` in the response to fetch the next page.
    Paginated responses also include a `Link` header with `rel="next"` pointing to the next page URL.

    ## Incremental Sync
    To keep a local copy current, poll `updated_after`, not `published_after`.

    1. Request `?updated_after=<your last completed sync>`.
    2. Results are ordered by `updated_at` ascending and cursor-paginated.
    3. Follow `pagination.next_cursor`, resending the same `updated_after`, until it is `null`.
    4. Only then store the time the sync started, minus a small overlap, as your new
       watermark. A minute is plenty.

    Step 3 matters: a response is capped at `limit` (default 25, max 100), so a changed set
    larger than one page arrives across several. Advancing your watermark before draining
    every page skips the remainder.

    The overlap in step 4 matters for the same reason: a record's `updated_at` is set when
    the write happens, but it only becomes visible when that write commits a moment later.
    Without an overlap a record can be stamped just before your watermark and land just
    after it, and you would never ask for it again. Re-reading a minute of changes is
    cheap and idempotent.

    `published_at` is editorial time: when the news happened, not when the record reached
    this API. A record can therefore appear with a `published_at` older than one you already
    hold. Records are re-sent when they change, so reconcile by `id`.

    Removals are not signaled: an article withdrawn from the feed stops being returned.
    Incremental sync tells you what changed, not what disappeared, so treat a local mirror
    as append-and-update rather than an exact replica.

    ## Error Handling
    Errors follow the RFC 9457 Problem Details format with appropriate HTTP status codes.
  contact:
    name: API Support
    email: hello@nordicfinancialnews.com
paths:
  "/api/v1/articles/{id}":
    get:
      summary: Get Article Details
      tags:
      - Articles
      security:
      - bearer_auth: []
      description: 'Returns the details of a single article: an English headline,
        a short summary, key points, and associated companies, along with `article_url`
        pointing to the full original-language article at the source. Supports conditional
        requests via `If-None-Match` for efficient caching.'
      parameters:
      - name: id
        in: path
        required: true
        description: Article ID (e.g. `art_abc123def`).
        example: art_abc123def
        schema:
          type: string
      - name: include_peripheral
        in: query
        required: false
        description: When `true`, widen `companies` and `company_ids` back to peripheral
          associations (a company named only as the article's source, an advisor,
          or a passing mention), which are otherwise excluded. Default `false` (principal-only).
          Each `companies[]` entry always carries `association_tier` regardless of
          this parameter.
        example: 'true'
        schema:
          type: boolean
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if the article has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                type: object
                properties:
                  article:
                    "$ref": "#/components/schemas/ArticleDetail"
        '304':
          description: Not Modified
        '404':
          description: Article not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: The requested resource could not be found
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/meta":
    get:
      summary: Get API metadata
      tags:
      - Meta
      security:
      - bearer_auth: []
      description: Returns API metadata including version, capabilities, supported
        fields, content types, and rate limit policy.
      responses:
        '200':
          description: API metadata retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v1
                  capabilities:
                    type: array
                    items:
                      type: string
                  supported_fields:
                    type: object
                    properties:
                      articles:
                        type: array
                        items:
                          type: string
                      stories:
                        type: array
                        items:
                          type: string
                      events:
                        type: array
                        items:
                          type: string
                      event_types:
                        type: array
                        items:
                          type: string
                      calendar_events:
                        type: array
                        items:
                          type: string
                      categories:
                        type: array
                        items:
                          type: string
                      companies:
                        type: array
                        items:
                          type: string
                      countries:
                        type: array
                        items:
                          type: string
                      exchanges:
                        type: array
                        items:
                          type: string
                      indices:
                        type: array
                        items:
                          type: string
                      sources:
                        type: array
                        items:
                          type: string
                  search:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      parameters:
                        type: array
                        items:
                          type: string
                      searchable_types:
                        type: array
                        items:
                          type: string
                      per_resource:
                        type: array
                        items:
                          type: string
                  content_types:
                    type: array
                    items:
                      type: string
                  sectors:
                    type: array
                    items:
                      type: string
                  rate_limit_policy:
                    type: string
                  supported_countries:
                    type: array
                    items:
                      type: string
                  supported_scopes:
                    type: array
                    items:
                      type: string
                required:
                - version
                - capabilities
                - supported_fields
                - content_types
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/search":
    get:
      summary: Search
      tags:
      - Search
      security:
      - bearer_auth: []
      description: Search across articles, stories, companies, countries, exchanges,
        and indices. Results are grouped by resource type and ranked by relevance.
        Use `type` to limit which resource types are searched.
      parameters:
      - name: q
        in: query
        required: true
        description: Full-text search query (2-200 characters).
        example: Volvo
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Comma-separated list of resource types to search. Defaults to
          all types. Valid values: `articles`, `stories`, `companies`, `countries`,
          `exchanges`, `indices`.'
        example: articles,companies
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of results per resource type (default 5, max 25).
        example: 5
        schema:
          type: integer
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResult"
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/problem_details"
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/sources":
    get:
      summary: List Sources
      tags:
      - Sources
      security:
      - bearer_auth: []
      description: Returns a paginated list of enabled news sources, ordered alphabetically
        by name. Use source IDs to filter articles and stories via the `sources` parameter
        on the articles and stories list endpoints.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of sources to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor from a previous response.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include. Available fields:
          `id`, `name`, `domain`, `country`, `source_type`.'
        example: id,name,domain
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Sources retrieved
          content:
            application/json:
              examples:
                basic_response:
                  value:
                    sources:
                    - id: abc123def456
                      name: Dagens Industri
                      domain: di.se
                      country: SE
                      source_type: news_publication
                    - id: ghi789jkl012
                      name: Dagens Nyheter
                      domain: dn.se
                      country: SE
                      source_type: news_publication
                    pagination:
                      count: 2
                      next_cursor:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SourceSummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 25
                      next_cursor:
                        type: string
                        nullable: true
        '304':
          description: Not Modified
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/stories":
    get:
      summary: List Stories
      tags:
      - Stories
      security:
      - bearer_auth: []
      description: |-
        Returns a paginated list of published stories ordered by publication date (newest first). Each story synthesizes coverage of a single developing event from multiple source articles into one narrative.

        ## Filtering
        Supports filtering by country, category, source, and company ticker. Use `GET /api/v1/sources` to discover source IDs for the `sources` filter.

        ## Search
        Use `q` for full-text search: relevance-ranked by default, newest-first with `sort=latest`, or matched by meaning with `mode=semantic`.

        ## Polling for updates
        Use `updated_after` for incremental syncing.

        ## Caching
        Requests with `updated_after` are not cached: they return `Cache-Control: no-cache, no-store` and no `ETag`. The `ETag` reflects the response as served, not only record timestamps: it changes when plan limits alter the visible set, and when a story's visible article set changes, so a changed `ETag` does not necessarily mean a record was updated.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of stories to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor returned as `pagination.next_cursor`
          from a previous response. Mutually exclusive with `q` unless `sort=latest`
          is also given.
        schema:
          type: string
      - name: updated_after
        in: query
        required: false
        description: 'ISO 8601 datetime. Returns only stories updated after this timestamp.
          Use this for incremental sync: store the timestamp of your last completed
          sync, then request only newer results on each poll. Results are ordered
          by `updated_at` ascending and are cursor-paginated. Follow `pagination.next_cursor`,
          resending the same `updated_after` value, until it is null. Only advance
          your stored timestamp once you have drained every page (see the Real-Time
          Updates guide at https://docs.nordicfinancialnews.com). Mutually exclusive
          with `sort=latest` (with or without `q`). An `updated_after` walk is always
          ordered by `updated_at`.'
        example: '2024-01-01T00:00:00Z'
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Full-text search query (2-200 characters). By default, results
          are ranked by relevance instead of publication date, as a single page with
          no cursor. Mutually exclusive with `cursor` unless `sort=latest` is also
          given. Disables caching.
        example: Volvo earnings
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Result order for `q`. `relevance` (default) is a single relevance-ranked
          page with no cursor; it requires `q`, and returns 400 without one. `latest`
          turns `q` into a match filter under the endpoint's normal newest-first order
          (`published_at` descending) and the response is cursor-paginated like any
          other request; without `q` it is an accepted no-op (that's already the default
          order). Mutually exclusive with `updated_after`.
        example: latest
        schema:
          type: string
          enum:
          - relevance
          - latest
      - name: mode
        in: query
        required: false
        description: |-
          Set to `semantic` to match `q` by meaning rather than by keyword. The match runs over each story's title, summary and key entities. The narrative body is not part of the match, so it answers thematic questions a keyword match cannot ("defense contract wins", "battery cell capacity expansion").

          Requires `q`, is mutually exclusive with `sort`, `cursor` and `updated_after`, and returns a single ranked page capped by `limit`; every other filter (`country`, `category`, `sources`, `ticker`, `company`, `market`, `domicile`, `exchange`, `index`, `sector`, `watchlist`, `published_after`/`published_before`) remains a hard filter applied before the match, not after.

          Each story gains a `distance` (raw cosine, lower is closer, rounded to 4dp). Compare it only within one response, never across responses: the scale is model-dependent. Ranking also blends in a small recency bonus that `distance` does not reflect. A server-side relevance floor drops weak matches, so a page is frequently shorter than `limit` and can be empty. Raising `limit` does not recover floored rows.

          On restricted plans, the story age window narrows the candidate set and the story count cap applies as a clamp on this page, so a capped plan receives its closest matches rather than its newest stories; either restriction sets `plan_limited: true`.

          The response `pagination` object carries `count` only. There is no `next_cursor`, since a distance ranking cannot be cursor-paginated, and the response is uncacheable (`Cache-Control: no-cache, no-store`, no `ETag`). If the query cannot be embedded the request returns `503` rather than silently falling back to keyword matching.
        example: semantic
        schema:
          type: string
          enum:
          - semantic
      - name: country
        in: query
        required: false
        description: Filter by country using ISO 3166-1 alpha-2 code (e.g. `SE`, `NO`,
          `DK`). Comma-separated for multiple (e.g. `SE,NO`). Case-insensitive.
        example: SE
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Filter by category `id` (from `GET /api/v1/categories`). Comma-separated
          for multiple (e.g. `cat_earnings1,cat_mna000001`); unknown ids are ignored.
        example: cat_earnings1
        schema:
          type: string
      - name: sources
        in: query
        required: false
        description: Comma-separated list of source IDs (max 25). Use `GET /api/v1/sources`
          to discover source IDs. Also accepts array form (`sources[]=id1&sources[]=id2`).
          Returns stories with at least one article from a listed source.
        example: abc123def456,ghi789jkl012
        schema:
          type: string
      - name: ticker
        in: query
        required: false
        description: 'Filter by company stock ticker symbol, comma-separated for several
          (e.g. `VOLV-B` or `VOLV-B,ERIC-B`; matches any of them). Accepts full tickers
          with exchange suffix (e.g. `VOLV-B.ST`). Returns stories mentioning the
          company. Former tickers resolve too: a company that renamed or moved venues
          is still reachable by an old ticker; the returned company `former_tickers`
          lists any such historical tickers. Matching is case-insensitive. Every value
          must resolve to a company, or the request is rejected with `400` naming
          the unknown values. Combined with `company`, the two filters intersect.'
        example: VOLV-B
        schema:
          type: string
      - name: company
        in: query
        required: false
        description: Filter by company `id` (as returned by the companies endpoints),
          comma-separated for several (matches any of them). Complements `ticker`;
          use this to reach companies without a stock listing. Every value must resolve,
          or the request is rejected with `400` naming the unknown ids. Combined with
          `ticker`, the two filters intersect.
        example: cmpny1234567
        schema:
          type: string
      - name: exchange
        in: query
        required: false
        description: Filter by exchange using ISO 10383 Market Identifier Code, comma-separated
          for multiple (e.g. `XSTO` for Nasdaq Stockholm, `XCSE` for Nasdaq Copenhagen,
          `XHEL` for Nasdaq Helsinki, `XOSL` for Oslo Børs). Returns stories about
          companies actively listed there. Case-insensitive.
        example: XSTO,XCSE
        schema:
          type: string
      - name: market
        in: query
        required: false
        description: Filter to stories about companies with an active equity listing
          in these countries' exchanges (ISO 3166-1 alpha-2, comma-separated, e.g.
          `SE,NO`). `SE` covers Nasdaq Stockholm, First North, Spotlight and NGM.
          Distinct from `country` (the source that reported it) and `domicile` (legal
          domicile). Includes foreign-domiciled but locally-listed issuers.
        example: SE
        schema:
          type: string
      - name: domicile
        in: query
        required: false
        description: Filter to stories about companies legally domiciled in these
          countries (ISO 3166-1 alpha-2, comma-separated). Reaches unlisted companies;
          excludes foreign-domiciled but locally-listed issuers. Use `market` for
          market-coverage questions.
        example: SE
        schema:
          type: string
      - name: index
        in: query
        required: false
        description: Filter by stock index id or symbol (e.g. `OMXS30`, `OMXC25`,
          `OMXH25`, `OBX`). Returns stories about companies in that index. Case-insensitive
          for symbols.
        example: OMXS30
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: 'Filter by company sector. Case-sensitive; must exactly match
          one of: `Communication Services`, `Consumer Discretionary`, `Consumer Staples`,
          `Energy`, `Financials`, `Health Care`, `Industrials`, `Information Technology`,
          `Materials`, `Real Estate`, `Utilities`.'
        example: Industrials
        schema:
          type: string
      - name: listed
        in: query
        required: false
        description: When `true`, only return stories linked to at least one company
          with an active listing on any exchange. A company whose listings are all
          delisted does not count. Hidden and unverified companies do not count.
        example: 'true'
        schema:
          type: string
      - name: watchlist
        in: query
        required: false
        description: Restricts to stories mentioning companies in a single watchlist,
          identified by its `id` (from the List Watchlists endpoint). An unknown id
          returns no stories. Requires `read:watchlist` scope.
        example: wl_8fk2a1b3c4d5
        schema:
          type: string
      - name: published_after
        in: query
        required: false
        description: ISO 8601 datetime. Returns stories published on or after this
          timestamp.
        example: '2024-06-01T00:00:00Z'
        schema:
          type: string
      - name: published_before
        in: query
        required: false
        description: ISO 8601 datetime. Returns stories published before this timestamp.
        example: '2024-12-31T23:59:59Z'
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include in the response. Available
          fields: `id`, `title`, `summary`, `published_at`, `updated_at`, `article_count`,
          `article_ids`, `country`, `category`, `company_ids`.'
        example: id,title,summary,published_at
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Stories retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  stories:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StorySummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 25
                      next_cursor:
                        type: string
                        nullable: true
                  plan_limited:
                    type: boolean
                    description: Present and `true` when your plan restricted what
                      this endpoint can return, so the result may be incomplete. Absent
                      when your plan applies no restriction.
                    example: true
        '304':
          description: Not Modified
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/stories/{id}":
    get:
      summary: Get Story Details
      tags:
      - Stories
      security:
      - bearer_auth: []
      description: Returns the full details of a single story, including content in
        Markdown format, associated articles, and companies. Supports conditional
        requests via `If-None-Match` for efficient caching.
      parameters:
      - name: id
        in: path
        required: true
        description: Story ID (e.g. `sty_abc123def`).
        example: sty_abc123def
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if the story has not changed.
        schema:
          type: string
      responses:
        '200':
          description: Story found
          content:
            application/json:
              schema:
                type: object
                properties:
                  story:
                    "$ref": "#/components/schemas/StoryDetail"
        '304':
          description: Not Modified
        '404':
          description: Story not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/not-found
                    title: Not Found
                    status: 404
                    detail: The requested resource could not be found
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/articles":
    get:
      summary: List Articles
      tags:
      - Articles
      security:
      - bearer_auth: []
      description: |-
        Returns a paginated list of live articles ordered by publication date (newest first). Each article includes an English headline, a short summary, and key points, with `article_url` linking to the full original-language article at the source.

        ## Filtering
        Supports filtering by country, category, source, company ticker, and content type. Use `GET /api/v1/sources` to discover source IDs for the `sources` filter. Use `ids` for batch lookup of specific articles.

        ## Search
        Use `q` for full-text search: relevance-ranked by default, newest-first with `sort=latest`, or matched by meaning with `mode=semantic`.

        ## Polling for updates
        Use `updated_after` for incremental syncing.

        ## Pagination
        Responses include cursor-based pagination and support field projection to minimize payload size.

        ## Caching
        Requests with `updated_after` are not cached: they return `Cache-Control: no-cache, no-store` and no `ETag`. The `ETag` reflects the response as served, not only record timestamps: it changes when plan limits alter the visible set, so a changed `ETag` does not necessarily mean a record was updated.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of articles to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor returned as `pagination.next_cursor`
          from a previous response. Mutually exclusive with `q` unless `sort=latest`
          is also given.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include in the response. Reduces
          payload size. Available fields: `id`, `title`, `article_url`, `published_at`,
          `updated_at`, `content_type`, `source`, `company_ids`, `country`, `category`.'
        example: id,title,published_at
        schema:
          type: string
      - name: updated_after
        in: query
        required: false
        description: 'ISO 8601 datetime. Returns only articles updated after this
          timestamp. Use this for incremental sync: store the timestamp of your last
          completed sync, then request only newer results on each poll. Results are
          ordered by `updated_at` ascending and are cursor-paginated. Follow `pagination.next_cursor`,
          resending the same `updated_after` value, until it is null. Only advance
          your stored timestamp once you have drained every page (see the Real-Time
          Updates guide at https://docs.nordicfinancialnews.com). Mutually exclusive
          with `sort=latest` (with or without `q`). An `updated_after` walk is always
          ordered by `updated_at`.'
        example: '2024-01-01T00:00:00Z'
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Full-text search query (2-200 characters). By default, results
          are ranked by relevance instead of publication date, as a single page with
          no cursor. Mutually exclusive with `cursor` unless `sort=latest` is also
          given. Disables caching.
        example: Volvo earnings
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Result order for `q`. `relevance` (default) is a single relevance-ranked
          page with no cursor; it requires `q`, and returns 400 without one. `latest`
          turns `q` into a match filter under the endpoint's normal newest-first order
          (`published_at` descending) and the response is cursor-paginated like any
          other request; without `q` it is an accepted no-op (that's already the default
          order). Mutually exclusive with `updated_after`.
        example: latest
        schema:
          type: string
          enum:
          - relevance
          - latest
      - name: mode
        in: query
        required: false
        description: |-
          Set to `semantic` to match `q` by meaning rather than by keyword. The match runs over each article's translated title and summary, so it answers thematic questions a keyword match cannot ("defense contract wins", "battery cell capacity expansion").

          Requires `q`, is mutually exclusive with `sort`, `cursor`, `updated_after` and `ids`, and returns a single ranked page capped by `limit`; every other filter (`country`, `category`, `sources`, `source_type`, `ticker`, `company`, `market`, `domicile`, `exchange`, `index`, `sector`, `watchlist`, `content_type`, `published_after`/`published_before`) remains a hard filter applied before the match, not after.

          Each article gains a `distance` (raw cosine, lower is closer, rounded to 4dp). Compare it only within one response, never across responses: the scale is model-dependent. Ranking also blends in a small recency bonus that `distance` does not reflect. A server-side relevance floor drops weak matches, so a page is frequently shorter than `limit` and can be empty. Raising `limit` does not recover floored rows.

          On plans with restricted article access the response carries `plan_limited: true`; the plan article count cap does not apply in this mode, only the source and age restrictions.

          The response `pagination` object carries `count` only. There is no `next_cursor`, since a distance ranking cannot be cursor-paginated, and the response is uncacheable (`Cache-Control: no-cache, no-store`, no `ETag`). If the query cannot be embedded the request returns `503` rather than silently falling back to keyword matching.
        example: semantic
        schema:
          type: string
          enum:
          - semantic
      - name: country
        in: query
        required: false
        description: Filter by country using ISO 3166-1 alpha-2 code (e.g. `SE`, `NO`,
          `DK`). Comma-separated for multiple (e.g. `SE,NO`). Case-insensitive.
        example: SE
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Filter by category `id` (from `GET /api/v1/categories`). Comma-separated
          for multiple (e.g. `cat_earnings1,cat_mna000001`); unknown ids are ignored.
        example: cat_earnings1
        schema:
          type: string
      - name: sources
        in: query
        required: false
        description: Comma-separated list of source IDs (max 25). Use `GET /api/v1/sources`
          to discover source IDs. Also accepts array form (`sources[]=id1&sources[]=id2`).
          Disabled sources resolve to empty results.
        example: abc123def456,ghi789jkl012
        schema:
          type: string
      - name: source_type
        in: query
        required: false
        description: 'Filter by source type, comma-separated. Valid values: `news_publication`,
          `wire_service`, `press_release`, `government`, `trade_publication`, `blog`,
          `stock_exchange`, `research`. Articles from disabled sources are excluded.
          An unrecognized value returns 400 naming the bad value(s).'
        example: stock_exchange
        schema:
          type: string
      - name: ticker
        in: query
        required: false
        description: 'Filter by company stock ticker symbol, comma-separated for several
          (e.g. `VOLV-B` or `VOLV-B,ERIC-B`; matches any of them). Accepts full tickers
          with exchange suffix (e.g. `VOLV-B.ST`). Returns articles where the company
          is a principal association (subject, partner, investor, or competitor) —
          a company named only as the article''s source, an advisor, or a passing
          mention does not match. Former tickers resolve too: a company that renamed
          or moved venues is still reachable by an old ticker; the returned company
          `former_tickers` lists any such historical tickers. Matching is case-insensitive.
          Every value must resolve to a company, or the request is rejected with `400`
          naming the unknown values. Combined with `company`, the two filters intersect.'
        example: VOLV-B
        schema:
          type: string
      - name: company
        in: query
        required: false
        description: Filter by company `id` (as returned by the companies endpoints),
          comma-separated for several (matches any of them). Complements `ticker`;
          use this to reach companies without a stock listing. Matches only the company's
          principal associations (subject, partner, investor, or competitor); a passing
          mention does not match. Every value must resolve, or the request is rejected
          with `400` naming the unknown ids. Combined with `ticker`, the two filters
          intersect.
        example: cmpny1234567
        schema:
          type: string
      - name: exchange
        in: query
        required: false
        description: Filter by exchange using ISO 10383 Market Identifier Code, comma-separated
          for multiple (e.g. `XSTO` for Nasdaq Stockholm, `XCSE` for Nasdaq Copenhagen,
          `XHEL` for Nasdaq Helsinki, `XOSL` for Oslo Børs). Returns articles about
          companies actively listed there. A company counts only through a principal
          association (subject, partner, investor, or competitor); a passing mention
          does not qualify. Case-insensitive.
        example: XSTO,XCSE
        schema:
          type: string
      - name: market
        in: query
        required: false
        description: Filter to articles about companies with an active equity listing
          in these countries' exchanges (ISO 3166-1 alpha-2, comma-separated, e.g.
          `SE,NO`). `SE` covers Nasdaq Stockholm, First North, Spotlight and NGM.
          Distinct from `country` (the source that reported it) and `domicile` (legal
          domicile). Includes foreign-domiciled but locally-listed issuers. A company
          counts only through a principal association (subject, partner, investor,
          or competitor); a passing mention does not qualify.
        example: SE
        schema:
          type: string
      - name: domicile
        in: query
        required: false
        description: Filter to articles about companies legally domiciled in these
          countries (ISO 3166-1 alpha-2, comma-separated). Reaches unlisted companies;
          excludes foreign-domiciled but locally-listed issuers. Use `market` for
          market-coverage questions. A company counts only through a principal association
          (subject, partner, investor, or competitor); a passing mention does not
          qualify.
        example: SE
        schema:
          type: string
      - name: index
        in: query
        required: false
        description: Filter by stock index id or symbol (e.g. `OMXS30`, `OMXC25`,
          `OMXH25`, `OBX`). Returns articles about companies in that index. A company
          counts only through a principal association (subject, partner, investor,
          or competitor); a passing mention does not qualify. Case-insensitive for
          symbols.
        example: OMXS30
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: 'Filter by company sector. A company counts only through a principal
          association (subject, partner, investor, or competitor); a passing mention
          does not qualify. Case-sensitive; must exactly match one of: `Communication
          Services`, `Consumer Discretionary`, `Consumer Staples`, `Energy`, `Financials`,
          `Health Care`, `Industrials`, `Information Technology`, `Materials`, `Real
          Estate`, `Utilities`.'
        example: Industrials
        schema:
          type: string
      - name: content_type
        in: query
        required: false
        description: 'Filter by article content type, comma-separated. Valid values:
          `news`, `analysis`, `press_release`, `market_commentary`, `market_news`,
          `trading_halt`, `trading_event`, `other`. `GET /api/v1/meta` lists them
          as `content_types`. An unrecognized value returns 400 naming the bad value(s).'
        example: news,analysis
        schema:
          type: string
      - name: published_after
        in: query
        required: false
        description: ISO 8601 datetime. Returns articles published on or after this
          timestamp.
        example: '2024-06-01T00:00:00Z'
        schema:
          type: string
      - name: published_before
        in: query
        required: false
        description: ISO 8601 datetime. Returns articles published before this timestamp.
        example: '2024-12-31T23:59:59Z'
        schema:
          type: string
      - name: listed
        in: query
        required: false
        description: When `true`, only return articles about at least one company
          with an active listing on any exchange, through a principal association
          (subject, partner, investor, or competitor). A passing mention does not
          qualify, and `include_peripheral` does not change this. A company whose
          listings are all delisted does not count. Hidden and unverified companies
          do not count.
        example: 'true'
        schema:
          type: string
      - name: watchlist
        in: query
        required: false
        description: Restricts to articles about companies in a single watchlist,
          identified by its `id` (from the List Watchlists endpoint), through a principal
          association (subject, partner, investor, or competitor) — a passing mention
          does not qualify. An unknown id returns no articles. Requires `read:watchlist`
          scope.
        example: wl_8fk2a1b3c4d5
        schema:
          type: string
      - name: primary_only
        in: query
        required: false
        description: When `true`, narrows further within the already-principal match,
          to only articles where the matched company (`ticker`, `company`, or `watchlist`)
          is the primary subject. Requires `ticker`, `company`, or `watchlist`, and
          returns 400 without one.
        example: 'true'
        schema:
          type: boolean
      - name: include_peripheral
        in: query
        required: false
        description: 'When `true`, widen the `ticker`, `company` and `watchlist` filters
          — and each article''s `company_ids` — back to peripheral associations (a
          company named only as the article''s source, an advisor, or a passing mention),
          which are otherwise excluded. Default `false` (principal-only: subject,
          partner, investor, competitor). `primary_only` still wins where it applies:
          the primary-subject restriction is kept even when peripheral is requested.
          Not honored on `GET /api/v1/search`.'
        example: 'true'
        schema:
          type: boolean
      - name: ids
        in: query
        required: false
        description: 'Comma-separated list of article IDs for batch lookup (max 100).
          Cannot be combined with `cursor`, `updated_after`, or `sort`. Returns a
          single page: `pagination` carries `count` only, with no `next_cursor`. IDs
          that don''t resolve, or that your plan can''t access, are omitted rather
          than rejected, so `count` can be less than the number of IDs sent. Key off
          each row''s `id`.'
        example: k3n9x2m7p4q1,b8v5c2z6w1r3
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Articles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArticleSummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 25
                      next_cursor:
                        type: string
                        nullable: true
                required:
                - articles
        '304':
          description: Not Modified
        '401':
          description: unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                "$ref": "#/components/schemas/problem_details"
  "/api/v1/calendar_events":
    get:
      summary: List Calendar Events
      tags:
      - Calendar Events
      security:
      - bearer_auth: []
      description: |-
        Returns a paginated list of scheduled Nordic financial calendar events: earnings reports (Q1 / H1 / FY etc.), earnings calls, trading updates, AGMs/EGMs, capital markets days, conference presentations, dividends, and M&A milestones (announcements, offer deadlines, completions).

        Each event is tied to a single company and is sorted by `scheduled_at` ascending (soonest first). `scheduled_at` is always in UTC; for local-time display use the `local_time` field (`scheduled_at` rendered in the issuer's `timezone`, ISO 8601 with offset). Prefer `local_time` for the calendar date. A day-precision event is stored at local midnight, so its UTC `scheduled_at` falls on the previous day for ahead-of-UTC (Nordic) zones. `title` and `description` are always English regardless of the source-article language.

        ## Dividends
        Each dividend row carries a nested `dividend` object with `ex_date`, `record_date`, `payment_date`, `declaration_date`, and `kind`. `scheduled_at` follows the priority **ex-date > record-date > payment-date**, whichever is explicitly stated, in that order. `dividend` is `null` for non-dividend events.

        ## Default window
        By default only upcoming events are returned, from today onward by the issuer's local date (so events scheduled for today stay listed throughout the day). Pass `scheduled_after` or `scheduled_before` to query a specific window. This also surfaces past events, which carry `status: published` (events flip from `scheduled` to `published` ~2 days after their date). An `updated_after` sync walk also lifts this floor, since sync must cover past events too.

        ## Status
        List endpoints return `scheduled` + `published` events and **exclude `cancelled`** by default. Pass the `status` parameter to filter (`status=cancelled` to retrieve cancellations, or `scheduled`/`published` to narrow). Discarded events are never returned. Note: a `scheduled → cancelled` transition is *not* surfaced by default `updated_after` polling. To track cancellations, poll with `status=cancelled` or subscribe to cancellation alerts.

        ## Filtering
        Compose `ticker`, `country`, `market`, `domicile`, `exchange`, `index`, `sector`, and `event_type` to narrow the result set. All filters are intersected.

        ## Polling for updates
        Use `updated_after` with the timestamp of your last completed sync to fetch only events that have changed since. Results are then ordered by `updated_at` ascending and cursor-paginated: follow `pagination.next_cursor`, resending the same `updated_after`, until it is null. Advance your stored timestamp only once every page is drained. Incremental sync is not available on plans with a capped calendar. `updated_after` returns 403 there, because the capped window is recomputed per request and a change feed over it cannot be drained. The walk covers the full served dataset, including past events, so a first sync from an old watermark returns history rather than only upcoming events. Updates to past events that occurred before your currently stored watermark are not replayed; reset the watermark (or start a fresh sync) to backfill them.

        ## Pagination
        List responses include `pagination.next_cursor` when more pages are available. Pass it back as the `cursor` parameter on the next request. Cursors are opaque. Do not parse them.

        ## Caching
        Requests with `updated_after` are not cached: they return `Cache-Control: no-cache, no-store` and no `ETag`. Otherwise the `ETag` reflects the response as served, not only record timestamps: it changes when plan limits alter the visible set, so a changed `ETag` does not necessarily mean a record was updated.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of events to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor returned as `pagination.next_cursor`
          from a previous response. When continuing an `updated_after` sync, resend
          the same `updated_after` value alongside it.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include in the response. Reduces
          payload size. `id` is always included. Available fields: `title`, `description`,
          `event_type`, `status`, `date_precision`, `fiscal_period`, `scheduled_at`,
          `timezone`, `local_time`, `scheduled_at_changed_at`, `source_article_id`,
          `source`, `company_id`, `company`, `country`, `dividend`, `updated_at`.'
        example: title,event_type,scheduled_at,company_id,dividend
        schema:
          type: string
      - name: updated_after
        in: query
        required: false
        description: 'ISO 8601 datetime. Returns only events updated after this timestamp.
          Use for incremental sync: store the timestamp of your last completed sync
          and pass it on the next request. Results are ordered by `updated_at` ascending
          and cursor-paginated. Drain `pagination.next_cursor` before advancing your
          stored timestamp. Passing this parameter also disables the default upcoming-only
          floor, so past events with newer updates are included.'
        example: '2026-03-01T00:00:00Z'
        schema:
          type: string
      - name: ticker
        in: query
        required: false
        description: Filter by company stock ticker (e.g. `VOLV-B`), comma-separated
          for several (matches any of them). Also accepts exchange-suffixed form (e.g.
          `VOLV-B.ST`); former tickers resolve. Matching is case-insensitive. Every
          value must resolve to a company, or the request is rejected with `400` naming
          the unknown values. A company outside the calendar's Nordic coverage resolves
          but returns no events. Combined with `company`, the two filters intersect.
        example: VOLV-B
        schema:
          type: string
      - name: company
        in: query
        required: false
        description: Filter by company `id` (as returned by the companies endpoints),
          comma-separated for several (matches any of them). Complements `ticker`;
          use this to reach companies without a stock listing. Every value must resolve,
          or the request is rejected with `400` naming the unknown ids. A company
          outside the calendar's Nordic coverage resolves but returns no events. Combined
          with `ticker`, the two filters intersect.
        example: cmpny1234567
        schema:
          type: string
      - name: country
        in: query
        required: false
        description: 'Filter by country using ISO 3166-1 alpha-2 code (e.g. `SE`,
          `DK`, `NO`, `FI`, `IS`). Comma-separated for multiple (e.g. `SE,NO`). Case-insensitive.
          This is the event''s country: the issuer''s, with source-country fallback.'
        example: SE
        schema:
          type: string
      - name: market
        in: query
        required: false
        description: Filter to events for an issuer with an active equity listing
          in these countries' exchanges (ISO 3166-1 alpha-2, comma-separated, e.g.
          `SE,NO`). `SE` covers Nasdaq Stockholm, First North, Spotlight and NGM.
          Distinct from `country` (the event's own country) and `domicile` (legal
          domicile). Includes foreign-domiciled but locally-listed issuers.
        example: SE
        schema:
          type: string
      - name: domicile
        in: query
        required: false
        description: Filter to events for an issuer legally domiciled in these countries
          (ISO 3166-1 alpha-2, comma-separated). Reaches unlisted companies; excludes
          foreign-domiciled but locally-listed issuers. Use `market` for market-coverage
          questions.
        example: SE
        schema:
          type: string
      - name: exchange
        in: query
        required: false
        description: Filter by exchange using ISO 10383 Market Identifier Code, comma-separated
          for multiple (e.g. `XSTO` for Nasdaq Stockholm, `XCSE` for Nasdaq Copenhagen,
          `XHEL` for Nasdaq Helsinki, `XOSL` for Oslo Børs, or `XSTO,XCSE`). Only
          events for an issuer with an active listing on the exchange match. Case-insensitive.
        example: XSTO
        schema:
          type: string
      - name: index
        in: query
        required: false
        description: Filter by stock index id or symbol (e.g. `OMXS30`, `OMXC25`,
          `OMXH25`, `OBX`). Returns events only for companies in that index. Case-insensitive
          for symbols.
        example: OMXS30
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: 'Filter by company sector. Must exactly match one of the standard
          sector names: `Communication Services`, `Consumer Discretionary`, `Consumer
          Staples`, `Energy`, `Financials`, `Health Care`, `Industrials`, `Information
          Technology`, `Materials`, `Real Estate`, `Utilities`.'
        example: Industrials
        schema:
          type: string
      - name: event_type
        in: query
        required: false
        description: 'Filter by calendar event type. Accepts a single value or a comma-separated
          list for multiple types. These are calendar event types (underscored) and
          are the only values accepted here. The hyphenated Events taxonomy slugs
          from `GET /api/v1/event_types` belong to `GET /api/v1/events` and are rejected.
          A few spellings overlap across the two vocabularies (e.g. `delisting`) while
          denoting different things: a calendar event is a dated, scheduled entry
          for one issuer; an Events slug classifies a narrative event that already
          happened.'
        example: earnings_report,earnings_call
        schema:
          type: string
          enum:
          - earnings_report
          - earnings_call
          - agm
          - egm
          - dividend
          - capital_markets_day
          - trading_update
          - conference_presentation
          - ma_announcement
          - ma_offer_deadline
          - ma_completion
          - listing
          - delisting
      - name: status
        in: query
        required: false
        description: 'Filter by lifecycle status. Omitted: returns `scheduled` + past
          `published` events and excludes `cancelled`. Pass `cancelled` to retrieve
          cancellations, or `scheduled`/`published` to narrow.'
        example: cancelled
        schema:
          type: string
          enum:
          - scheduled
          - published
          - cancelled
      - name: scheduled_after
        in: query
        required: false
        description: 'Window start. A bare date (`YYYY-MM-DD`) means that calendar
          date in each issuer''s own timezone, inclusive: `scheduled_after=2026-10-01&scheduled_before=2026-10-31`
          is October in every issuer''s local calendar. An ISO 8601 datetime (`Z`
          or a UTC offset) means an exact UTC instant, at or after. Passing this parameter
          disables the default upcoming-only floor, allowing past events to be returned.'
        example: '2026-10-01'
        schema:
