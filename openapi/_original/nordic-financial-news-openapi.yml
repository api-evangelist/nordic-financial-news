  "/api/v1/companies/{identifier}/articles":
    parameters:
    - name: identifier
      in: path
      required: true
      description: Company ID or ticker symbol. Accepts the exchange-suffixed form
        (e.g. `VOLV-B.ST`); former tickers resolve too. When a ticker is shared by
        more than one company, the company with a listing on a Nordic exchange is
        returned, then the one with an active listing, then the most recently listed.
        Use the company ID for an unambiguous lookup.
      schema:
        type: string
    get:
      summary: List Company Articles
      tags:
      - Companies
      security:
      - bearer_auth: []
      description: |-
        Returns articles where the company is a principal association (subject, partner, investor,
        or competitor), ordered by publication date (newest first). An article where this company
        is only the source, an advisor, or a passing mention is excluded.

        ## Parameters
        Accepts the same `q`, `sort`, `fields`, `updated_after`, `country`, `category`, `sources`, `source_type`, `content_type`, `published_after` and `published_before` parameters as `GET /api/v1/articles`, with identical semantics, scoped to this company. `primary_only=true` narrows further within that principal set, to only articles where this company is the primary subject.

        ## Rejected parameters
        `ticker`, `company`, `watchlist`, `listed`, `exchange`, `market`, `domicile`, `index` and `sector` are rejected (400). The path already fixes the company; use `GET /api/v1/articles` to filter the full collection by them (`watchlist=false` and `listed` with any value other than `true` are ignored, as on the flat resource).

        ## Caching
        Requests with `updated_after` are not cached: they return `Cache-Control: no-cache, no-store` and no `ETag`. The `ETag` reflects the response as served, not only record timestamps: it changes when plan limits alter the visible set, so a changed `ETag` does not necessarily mean a record was updated.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of articles to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor from a previous response. Mutually exclusive
          with `q` unless `sort=latest` is also given.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include in the response. Reduces
          payload size. Available fields: `id`, `title`, `article_url`, `published_at`,
          `updated_at`, `content_type`, `source`, `company_ids`, `country`, `category`.'
        example: id,title,published_at
        schema:
          type: string
      - name: updated_after
        in: query
        required: false
        description: 'ISO 8601 datetime. Returns only this company''s articles updated
          after this timestamp. Use this for incremental sync: store the timestamp
          of your last completed sync, then request only newer results on each poll.
          Results are ordered by `updated_at` ascending and are cursor-paginated.
          Follow `pagination.next_cursor`, resending the same `updated_after` value,
          until it is null. Only advance your stored timestamp once you have drained
          every page. Mutually exclusive with `sort=latest` (with or without `q`).
          An `updated_after` walk is always ordered by `updated_at`.'
        example: '2024-01-01T00:00:00Z'
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Full-text search query (2-200 characters). By default, results
          are ranked by relevance instead of publication date, as a single page with
          no cursor. Mutually exclusive with `cursor` unless `sort=latest` is also
          given. Disables caching.
        example: Volvo earnings
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Result order for `q`. `relevance` (default) is a single relevance-ranked
          page with no cursor; it requires `q`, and returns 400 without one. `latest`
          turns `q` into a match filter under the endpoint's normal newest-first order
          (`published_at` descending) and the response is cursor-paginated like any
          other request; without `q` it is an accepted no-op (that's already the default
          order). Mutually exclusive with `updated_after`.
        example: latest
        schema:
          type: string
          enum:
          - relevance
          - latest
      - name: country
        in: query
        required: false
        description: Filter by country using ISO 3166-1 alpha-2 code (e.g. `SE`, `NO`,
          `DK`). Comma-separated for multiple (e.g. `SE,NO`). Case-insensitive.
        example: SE
        schema:
          type: string
      - name: category
        in: query
        required: false
        description: Filter by category `id` (from `GET /api/v1/categories`). Comma-separated
          for multiple (e.g. `cat_earnings1,cat_mna000001`); unknown ids are ignored.
        example: cat_earnings1
        schema:
          type: string
      - name: sources
        in: query
        required: false
        description: Comma-separated list of source IDs (max 25). Use `GET /api/v1/sources`
          to discover source IDs. Also accepts array form (`sources[]=id1&sources[]=id2`).
          Disabled sources resolve to empty results.
        example: abc123def456,ghi789jkl012
        schema:
          type: string
      - name: source_type
        in: query
        required: false
        description: 'Filter by source type, comma-separated. Valid values: `news_publication`,
          `wire_service`, `press_release`, `government`, `trade_publication`, `blog`,
          `stock_exchange`, `research`. Articles from disabled sources are excluded.
          An unrecognized value returns 400 naming the bad value(s).'
        example: stock_exchange
        schema:
          type: string
      - name: content_type
        in: query
        required: false
        description: 'Filter by article content type, comma-separated. Valid values:
          `news`, `analysis`, `press_release`, `market_commentary`, `market_news`,
          `trading_halt`, `trading_event`, `other`. `GET /api/v1/meta` lists them
          as `content_types`. An unrecognized value returns 400 naming the bad value(s).'
        example: news,analysis
        schema:
          type: string
      - name: published_after
        in: query
        required: false
        description: ISO 8601 datetime. Returns articles published on or after this
          timestamp.
        example: '2024-06-01T00:00:00Z'
        schema:
          type: string
      - name: published_before
        in: query
        required: false
        description: ISO 8601 datetime. Returns articles published before this timestamp.
        example: '2024-12-31T23:59:59Z'
        schema:
          type: string
      - name: primary_only
        in: query
        required: false
        description: When `true`, narrows further within the already-principal match,
          to only articles where this company is the primary subject.
        schema:
          type: boolean
      - name: include_peripheral
        in: query
        required: false
        description: When `true`, widen this feed back to articles where the company
          is only a peripheral association (its source, an advisor, or a passing mention),
          which are otherwise excluded. Default `false` (principal-only). `primary_only`
          still keeps the primary-subject restriction even when peripheral is requested.
        schema:
          type: boolean
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Company articles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArticleSummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                      next_cursor:
                        type: string
                        nullable: true
                  plan_limited:
                    type: boolean
                    description: Present and `true` when your plan restricted what
                      this endpoint can return, so the result may be incomplete. Absent
                      when your plan applies no restriction.
                    example: true
                required:
                - articles
        '304':
          description: Not Modified
        '400':
          description: Invalid parameter
          content:
            application/json:
              examples:
                company_scoped_param:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/invalid-parameter
                    title: Invalid parameter
                    status: 400
                    detail: This endpoint is already scoped to a company by the path,
                      so ticker cannot apply here. Use GET /api/v1/articles to filter
                      the full collection by ticker.
                    instance: urn:request:a1b2c3
                    parameter: ticker
              schema:
                "$ref": "#/components/schemas/problem_details"
