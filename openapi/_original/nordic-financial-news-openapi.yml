      - name: scheduled_before
        in: query
        required: false
        description: Window end. A bare date means that calendar date in each issuer's
          own timezone, inclusive. An ISO 8601 datetime means an exact UTC instant,
          exclusive (strictly before). Passing this parameter disables the default
          upcoming-only floor, allowing past events to be returned.
        example: '2026-10-31'
        schema:
