  "/api/v1/companies":
    get:
      summary: List Companies
      tags:
      - Companies
      security:
      - bearer_auth: []
      description: Returns a paginated list of companies covered in Nordic financial
        news, ordered alphabetically by name. Use `q` for full-text search across
        company names, ranked by relevance, or add `mode=semantic` to match `q` by
        meaning instead.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of companies to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor returned as `pagination.next_cursor`
          from a previous response. Mutually exclusive with `q`.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include in the response. Available
          fields: `id`, `name`, `slug`, `ticker`, `former_tickers`.'
        example: id,name,ticker
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Full-text search query (2-200 characters). Searches company names
          and aliases. Results are ranked by relevance instead of alphabetical order.
          Mutually exclusive with `cursor`.
        example: Volvo
        schema:
          type: string
      - name: mode
        in: query
        required: false
        description: |-
          Set to `semantic` to match `q` by meaning rather than by name/ticker text. The match runs over each company's name, aliases, country, sector, industry and description, so it answers thematic questions a name match cannot ("defense contractors", "companies making battery cells").

          Put geography in `market`, `domicile` or `country` rather than in `q`. A place name in `q` matches company names containing it ("Nordic ...", "Swedish ...") ahead of companies that actually do that thing.

          Requires `q`, is mutually exclusive with `cursor`, and returns a single ranked page capped by `limit`; `company`, `ticker`, `country`, `market`, `domicile`, `exchange`, `sector`, `listed`, `watchlist` and `is_active` remain hard filters applied before the match, not after.

          Each company gains a `distance` (raw cosine, lower is closer, rounded to 4dp). Compare it only within one response, never across responses: the scale is model-dependent. Ranking also blends in a small coverage bonus that `distance` does not reflect. A server-side relevance floor drops weak matches, so a page is frequently shorter than `limit` and can be empty. Raising `limit` does not recover floored rows.

          The response `pagination` object carries `count` only. There is no `next_cursor`, since a distance ranking cannot be cursor-paginated, and the response is uncacheable (`Cache-Control: no-cache, no-store`, no `ETag`). If the query cannot be embedded the request returns `503` rather than silently falling back to name matching.
        example: semantic
        schema:
          type: string
          enum:
          - semantic
      - name: company
        in: query
        required: false
        description: Resolve specific company `id` values, comma-separated (maximum
          25). This is the batch-resolve path for the `company_id` and `company_ids`
          values returned by the articles, stories, events and calendar endpoints.
          Look up a whole page of them in one request instead of one `GET /companies/{identifier}`
          per company. Every id must resolve, or the request is rejected with `400`
          naming the unknown ids. Results are returned in name order, not the order
          requested, so key off each row's `id`. Combined with `ticker`, the two filters
          intersect.
        example: cmpny1234567,cmpny7654321
        schema:
          type: string
      - name: ticker
        in: query
        required: false
        description: Resolve specific stock tickers, comma-separated (maximum 25).
          Accepts the exchange-suffixed form (e.g. `VOLV-B.ST`) and resolves former
          tickers; matching is case-insensitive. Unlike `q` this is an exact filter,
          so it returns no near-matches and supports cursor pagination. Every ticker
          must resolve, or the request is rejected with `400` naming the unknown values.
          Combined with `company`, the two filters intersect. A ticker shared by more
          than one issuer resolves to every matching company, so a batch can return
          more rows than the number of tickers sent. `GET /companies/{identifier}`
          tie-breaks such a ticker to a single company, this filter does not.
        example: VOLV-B,ERIC-B
        schema:
          type: string
      - name: country
        in: query
        required: false
        description: Legal domicile, ISO 3166-1 alpha-2 code (e.g. `SE`, `NO`, `DK`).
          Comma-separated for multiple (e.g. `SE,NO`). Case-insensitive. Synonym for
          `domicile` on this endpoint, kept for backward compatibility. If both `country`
          and `domicile` are sent, they intersect.
        example: SE
        schema:
          type: string
      - name: market
        in: query
        required: false
        description: Filter to companies with an active equity listing in these countries'
          exchanges (ISO 3166-1 alpha-2, comma-separated, e.g. `SE,NO`). `SE` covers
          Nasdaq Stockholm, First North, Spotlight and NGM. Distinct from `country`/`domicile`
          (legal domicile). Includes foreign-domiciled but locally-listed issuers.
        example: SE
        schema:
          type: string
      - name: domicile
        in: query
        required: false
        description: Filter to companies legally domiciled in these countries (ISO
          3166-1 alpha-2, comma-separated). The canonical cross-surface name for what
          `country` already means on this endpoint; reaches unlisted companies and
          excludes foreign-domiciled but locally-listed issuers. Use `market` for
          market-coverage questions.
        example: SE
        schema:
          type: string
      - name: exchange
        in: query
        required: false
        description: Filter by exchange MIC code, comma-separated for multiple (e.g.
          `XSTO`, `XOSL,XCSE`). Only companies with an active listing on the exchange
          match.
        example: XSTO
        schema:
          type: string
      - name: sector
        in: query
        required: false
        description: Filter by industry sector (e.g. `Financials`, `Industrials`,
          `Information Technology`).
        example: Financials
        schema:
          type: string
      - name: listed
        in: query
        required: false
        description: When `true`, only return companies with at least one active stock
          exchange listing.
        example: 'true'
        schema:
          type: string
      - name: watchlist
        in: query
        required: false
        description: When `true`, only return companies in the authenticated user's
          watchlist. Requires `read:watchlist` scope.
        example: 'true'
        schema:
          type: string
      - name: is_active
        in: query
        required: false
        description: Filter by active status. When `true`, only return active companies.
          When `false`, only return inactive companies.
        example: 'true'
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified`
          if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304
          Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Companies retrieved successfully
          content:
            application/json:
              examples:
                companies_list:
                  value:
                    companies:
                    - id: comp_volvo123
                      name: Volvo AB
                      slug: volvo-ab
                      ticker: VOLV-B
                      is_active: true
                      exchange:
                        id: exch_xsto1234
                        name: Nasdaq Stockholm
                        mic_code: XSTO
                    pagination:
                      count: 1
                      next_cursor:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CompanySummary"
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                      next_cursor:
                        type: string
                        nullable: true
                required:
                - companies
        '304':
          description: Not Modified
        '400':
          description: Invalid parameter
          content:
            application/json:
              examples:
                unknown_company_id:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/invalid-parameter
                    title: Invalid parameter
                    status: 400
                    detail: 'Unknown company id(s): codoesnotexi9'
                    instance: urn:request:a1b2c3
                    parameter: company
              schema:
                "$ref": "#/components/schemas/problem_details"
