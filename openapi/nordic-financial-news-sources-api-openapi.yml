openapi: 3.2.0
info:
  title: Nordic Financial News Sources API
  version: v1.0
  description: REST API for Nordic financial news.
  contact:
    name: API Support
    email: hello@nordicfinancialnews.com
servers:
- url: https://nordicfinancialnews.com
  description: Production server
tags:
- name: Sources
paths:
  /api/v1/sources:
    get:
      summary: List Sources
      tags:
      - Sources
      security:
      - bearer_auth: []
      description: Returns a paginated list of enabled news sources, ordered alphabetically by name. Use source IDs to filter articles and stories via the `sources` parameter on the articles and stories list endpoints.
      parameters:
      - name: limit
        in: query
        required: false
        description: Number of sources to return per page (default 25, max 100).
        example: 25
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque pagination cursor from a previous response.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 'Comma-separated list of fields to include. Available fields: `id`, `name`, `domain`, `country`, `source_type`.'
        example: id,name,domain
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: ETag value from a previous response. Returns `304 Not Modified` if data has not changed.
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: HTTP date from a previous `Last-Modified` header. Returns `304 Not Modified` if nothing has changed since.
        schema:
          type: string
      responses:
        '200':
          description: Sources retrieved
          content:
            application/json:
              examples:
                basic_response:
                  value:
                    sources:
                    - id: abc123def456
                      name: Dagens Industri
                      domain: di.se
                      country: SE
                      source_type: news_publication
                    - id: ghi789jkl012
                      name: Dagens Nyheter
                      domain: dn.se
                      country: SE
                      source_type: news_publication
                    pagination:
                      count: 2
                      next_cursor: null
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceSummary'
                  pagination:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 25
                      next_cursor:
                        type:
                        - string
                        - 'null'
        '304':
          description: Not Modified
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    type: https://docs.nordicfinancialnews.com/problems/auth-invalid
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid API key
                    instance: urn:request:abc123
              schema:
                $ref: '#/components/schemas/problem_details'
      operationId: getApiV1Sources
      x-operation-id-source: derived
components:
  schemas:
    problem_details:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          description: URI that identifies the problem type
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation
        instance:
          type: string
          description: URI that identifies the specific occurrence
    SourceSummary:
      type: object
      required:
      - id
      - name
      - domain
      - source_type
      properties:
        id:
          type: string
          description: Unique source identifier
          example: abc123def456
        name:
          type: string
          description: Source display name
          example: Dagens Industri
        domain:
          type: string
          description: Primary domain of the source
          example: di.se
        country:
          type:
          - string
          - 'null'
          description: Country code (ISO 3166-1 alpha-2)
          example: SE
        source_type:
          type: string
          description: Source type
          example: news_publication
          enum:
          - news_publication
          - wire_service
          - press_release
          - government
          - trade_publication
          - blog
          - stock_exchange
          - research
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API Key authentication using Bearer token
x-provenance:
  method: harvested
  publisher: Nordic Financial News
  source: https://nordicfinancialnews.com/openapi/v1/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
